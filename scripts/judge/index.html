<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chấm câu mô tả</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #eef0f3; --border: #d5d9e0;
  --text: #16191f; --muted: #545b67; --brand: #1d4ed8; --brand-ink: #ffffff;
  --ok: #166534; --ok-soft: #dcfce7; --part: #92400e; --part-soft: #fef3c7;
  --danger: #b91c1c; --danger-soft: #fee2e2; --focus: #2563eb;
  --radius: 8px; --shadow: 0 1px 2px rgb(0 0 0 / .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --surface: #171a20; --surface-2: #20242c; --border: #333946;
    --text: #e8eaee; --muted: #a2a9b5; --brand: #6d9bff; --brand-ink: #0b1220;
    --ok: #86efac; --ok-soft: #12321f; --part: #fcd34d; --part-soft: #3a2d0c;
    --danger: #fca5a5; --danger-soft: #3b1616; --focus: #8ab4ff;
    --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.top {
  position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px 24px;
  align-items: center; padding: 12px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.top h1 { font-size: 20px; line-height: 1.2; margin: 0; }
.progress { display: flex; align-items: center; gap: 12px; flex: 1 1 240px; color: var(--muted); font-size: 14px; }
.bar { flex: 1; max-width: 320px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--brand); transition: width .2s ease-out; }
.top label { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
select, textarea, input[type=text] {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 12px; min-height: 44px;
}
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100dvh - 69px); }
.sidebar { border-right: 1px solid var(--border); background: var(--surface); overflow: auto; max-height: calc(100dvh - 69px); position: sticky; top: 69px; }
.sidebar ol { list-style: none; margin: 0; padding: 8px; }
.sidebar button {
  width: 100%; display: grid; grid-template-columns: 24px 1fr; gap: 8px; text-align: left;
  border: 0; background: transparent; border-radius: var(--radius); padding: 8px; min-height: 44px; cursor: pointer;
}
.sidebar button:hover { background: var(--surface-2); }
.sidebar button[aria-current="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--brand); }
.sidebar .q { font-size: 14px; }
.sidebar .sub { display: block; font-size: 12px; color: var(--muted); }
.mark { font-size: 14px; font-weight: 700; color: var(--muted); }
.mark.done { color: var(--ok); } .mark.flag { color: var(--part); }
main { padding: 16px 24px 120px; min-width: 0; }
.meta { margin: 0; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
h2 { font-size: 32px; line-height: 1.15; margin: 4px 0 12px; }
.rubric { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin: 0 0 8px; }
.rubric div { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
.rubric dt { font-weight: 700; min-width: 16px; }
.rubric dd { margin: 0; }
.hint { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
kbd { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 8px; padding: 8px; text-align: left;
  background: var(--surface); border: 2px solid var(--border); border-radius: 12px; cursor: pointer;
  box-shadow: var(--shadow); transition: border-color .15s ease-out, transform .15s ease-out;
}
.card:hover { border-color: var(--muted); }
.card:active { transform: scale(.99); }
.card[data-grade="2"] { border-color: var(--ok); background: var(--ok-soft); }
.card[data-grade="1"] { border-color: var(--part); background: var(--part-soft); }
.frame { aspect-ratio: 1; display: grid; place-items: center; background: var(--surface-2); border-radius: 6px; overflow: hidden; color: var(--muted); font-size: 14px; }
.frame img { width: 100%; height: 100%; object-fit: contain; }
.name { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 42px; }
.badge { position: absolute; top: 12px; left: 12px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
.card[data-grade="2"] .badge { color: var(--ok); border-color: var(--ok); }
.card[data-grade="1"] .badge { color: var(--part); border-color: var(--part); }
.zoom-btn { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: zoom-in; font-size: 16px; }
.actions {
  position: fixed; bottom: 0; left: 300px; right: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 12px 24px; background: var(--surface); border-top: 1px solid var(--border);
}
.counts { font-size: 14px; color: var(--muted); min-width: 150px; }
.actions .note { flex: 1 1 200px; }
.actions label.flag { display: flex; gap: 8px; align-items: center; font-size: 14px; min-height: 44px; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary kbd { background: transparent; color: inherit; border-color: currentColor; }
h2[tabindex="-1"]:focus { outline: none; }
.status { font-size: 14px; min-height: 21px; margin: 0; }
.status.error { color: var(--danger); }
.notice { padding: 24px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); max-width: 640px; }
.notice.error { border-color: var(--danger); background: var(--danger-soft); }
.skeleton { aspect-ratio: 1; border-radius: 12px; background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); padding: 16px; max-width: min(960px, 96vw); }
dialog::backdrop { background: rgb(0 0 0 / .6); }
dialog img { display: block; max-width: 100%; max-height: 78vh; margin: 0 auto 12px; object-fit: contain; }
dialog .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; max-height: 220px; border-right: 0; border-bottom: 1px solid var(--border); }
  /* The bar wraps to ~270px on a phone; in flow after the grid it never covers images. */
  .actions { position: static; padding: 12px 16px 24px; }
  main { padding: 16px; }
  h2 { font-size: 24px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1>Chấm câu mô tả</h1>
  <div class="progress"><span id="progress-text">Đang tải…</span><div class="bar" aria-hidden="true"><span id="progress-bar"></span></div></div>
  <label>Hiển thị
    <select id="filter">
      <option value="all">Tất cả câu</option>
      <option value="todo">Chưa chấm</option>
      <option value="dev">Tập dev</option>
      <option value="test">Tập test</option>
    </select>
  </label>
</header>
<div class="layout">
  <nav class="sidebar" aria-label="Danh sách câu hỏi"><ol id="qlist"></ol></nav>
  <main id="main">
    <div id="content">
      <div class="grid" aria-hidden="true">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
  </main>
</div>
<div class="actions" id="actions" hidden>
  <span class="counts" id="counts"></span>
  <label class="flag"><input type="checkbox" id="flag"> Câu hỏi mơ hồ, loại khỏi bộ đánh giá</label>
  <input type="text" class="note" id="note" maxlength="500" placeholder="Ghi chú (không bắt buộc)" aria-label="Ghi chú cho câu hỏi">
  <button class="btn" id="prev" type="button">← Câu trước</button>
  <button class="btn primary" id="save" type="button">Lưu &amp; câu tiếp <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</div>
<dialog id="zoom" aria-label="Ảnh phóng to">
  <img id="zoom-img" alt="">
  <div class="row"><span id="zoom-name"></span><button class="btn" type="button" id="zoom-close">Đóng <kbd>Esc</kbd></button></div>
</dialog>
<script>
"use strict";
const LABEL = { 0: "0 · Không", 1: "1 · Một phần", 2: "2 · Đúng" };
const KIND = { attribute: "vật + thuộc tính", category: "nhóm sản phẩm", visual: "mô tả hình ảnh", ambiguous: "câu đa nghĩa" };
const S = { queries: [], judgments: {}, idx: -1, grades: {}, saved: "", filter: "all", busy: false };
const $ = (id) => document.getElementById(id);

function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

function rubric(q) {
  if (q.kind === "category") return [["2", `Đúng là ${q.object}`], ["1", "Gần đúng: cùng nhóm hoặc liên quan trực tiếp"], ["0", "Không liên quan"]];
  if (q.kind === "visual") return [["2", `Thấy rõ: ${q.attribute}`], ["1", "Có một phần hoặc không chắc"], ["0", "Không có"]];
  return [["2", `Là ${q.object} và thấy rõ ${q.attribute}`], ["1", `Là ${q.object} nhưng ${q.attribute} sai hoặc không thấy`], ["0", `Không phải ${q.object}`]];
}
function snapshot() { return JSON.stringify([S.grades, $("flag").checked, $("note").value]); }
function dirty() { return S.idx >= 0 && snapshot() !== S.saved; }
function judged(q) { return Boolean(S.judgments[q.qid]); }
function visible() {
  return S.queries.map((q, i) => [q, i]).filter(([q]) =>
    S.filter === "all" || (S.filter === "todo" ? !judged(q) : q.split === S.filter));
}

function renderProgress() {
  const done = S.queries.filter(judged).length;
  const images = S.queries.filter(judged).reduce((n, q) => n + q.candidates.length, 0);
  $("progress-text").textContent = `Đã chấm ${done}/${S.queries.length} câu · ${images} ảnh`;
  $("progress-bar").style.width = `${S.queries.length ? (100 * done) / S.queries.length : 0}%`;
}

function renderList() {
  const list = $("qlist");
  list.replaceChildren();
  const rows = visible();
  if (!rows.length) {
    const li = document.createElement("li");
    li.className = "sub"; li.style.padding = "8px";
    li.textContent = S.filter === "todo" ? "Đã chấm hết. Chọn “Tất cả câu” để xem lại." : "Không có câu nào.";
    list.append(li);
  }
  for (const [q, i] of rows) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    const j = S.judgments[q.qid];
    const mark = document.createElement("span");
    mark.className = "mark" + (j ? (j.flag ? " flag" : " done") : "");
    mark.textContent = j ? (j.flag ? "⚑" : "✓") : "•";
    mark.setAttribute("aria-label", j ? (j.flag ? "đã loại" : "đã chấm") : "chưa chấm");
    const text = document.createElement("span");
    text.innerHTML = `<span class="q"></span><span class="sub"></span>`;
    text.querySelector(".q").textContent = q.query;
    text.querySelector(".sub").textContent = `${q.qid} · ${q.split} · ${q.candidates.length} ảnh`;
    b.append(mark, text);
    if (i === S.idx) b.setAttribute("aria-current", "true");
    b.addEventListener("click", () => open(i, true));
    li.append(b);
    list.append(li);
  }
  renderProgress();
}

function setGrade(card, grade) {
  S.grades[card.dataset.id] = grade;
  card.dataset.grade = grade;
  card.querySelector(".badge").textContent = LABEL[grade];
  card.setAttribute("aria-label", `${card.dataset.name}: ${LABEL[grade]}`);
  renderCounts();
}

function renderCounts() {
  const values = Object.values(S.grades);
  const n = (g) => values.filter((v) => v === g).length;
  $("counts").textContent = `Đúng ${n(2)} · Một phần ${n(1)} · Không ${n(0)}`;
}

function renderQuery() {
  const q = S.queries[S.idx];
  const content = $("content");
  content.replaceChildren();
  const head = document.createElement("section");
  head.innerHTML = `<p class="meta"></p><h2 tabindex="-1"></h2><dl class="rubric"></dl>
    <p class="hint">Bấm ảnh để đổi 0 → 2 → 1 · trên ảnh đang chọn: <kbd>2</kbd> <kbd>1</kbd> <kbd>0</kbd> chấm, <kbd>Z</kbd> phóng to, phím mũi tên để di chuyển. Chấm theo những gì thấy trong ảnh, tên sản phẩm chỉ để tham khảo.</p>`;
  head.querySelector(".meta").textContent = `${q.qid} · ${KIND[q.kind] || q.kind} · ${q.split}`;
  head.querySelector("h2").textContent = q.query;
  const dl = head.querySelector(".rubric");
  for (const [k, v] of rubric(q)) {
    const div = document.createElement("div");
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    div.append(dt, dd); dl.append(div);
  }
  const grid = document.createElement("div");
  grid.className = "grid"; grid.id = "grid";
  q.candidates.forEach((c, n) => {
    const card = document.createElement("button");
    card.type = "button"; card.className = "card";
    card.dataset.id = c.asset_id;
    card.dataset.name = c.names.join(", ") || `Ảnh ${n + 1}`;
    card.innerHTML = `<span class="frame"><img loading="lazy" width="224" height="224" alt=""></span><span class="name"></span><span class="badge"></span><span class="zoom-btn" role="presentation" title="Phóng to (Z)">⤢</span>`;
    const img = card.querySelector("img");
    img.src = `/img/${c.asset_id}`;
    img.addEventListener("error", () => { card.querySelector(".frame").textContent = "Không tải được ảnh"; });
    card.querySelector(".name").textContent = card.dataset.name;
    card.addEventListener("click", (event) => {
      if (event.target.closest(".zoom-btn")) { zoom(card); return; }
      const next = { 0: 2, 2: 1, 1: 0 }[S.grades[c.asset_id]];
      setGrade(card, next);
    });
    card.addEventListener("keydown", (event) => cardKey(event, card));
    grid.append(card);
    setGrade(card, S.grades[c.asset_id]);
  });
  content.append(head, grid);
  $("actions").hidden = false;
  $("prev").disabled = prevIndex() < 0;
}

function cardKey(event, card) {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (["0", "1", "2"].includes(event.key)) { setGrade(card, Number(event.key)); event.preventDefault(); return; }
  if (event.key === "z" || event.key === "Z") { zoom(card); event.preventDefault(); return; }
  const cards = [...document.querySelectorAll("#grid .card")];
  const cols = getComputedStyle($("grid")).gridTemplateColumns.split(" ").length;
  const at = cards.indexOf(card);
  const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[event.key];
  if (step !== undefined) {
    const target = cards[Math.min(cards.length - 1, Math.max(0, at + step))];
    target.focus(); event.preventDefault();
  }
}

let zoomOrigin = null;
function zoom(card) {
  zoomOrigin = card;
  $("zoom-img").src = `/img/${card.dataset.id}`;
  $("zoom-img").alt = card.dataset.name;
  $("zoom-name").textContent = card.dataset.name;
  $("zoom").showModal();
}
$("zoom-close").addEventListener("click", () => $("zoom").close());
$("zoom").addEventListener("close", () => zoomOrigin && zoomOrigin.focus());
$("zoom").addEventListener("click", (event) => { if (event.target === $("zoom")) $("zoom").close(); });

function open(i, focusGrid) {
  if (i === S.idx) return;
  if (dirty() && !confirm("Câu này có thay đổi chưa lưu. Bỏ thay đổi và chuyển câu?")) return;
  S.idx = i;
  const q = S.queries[i];
  const j = S.judgments[q.qid];
  S.grades = Object.fromEntries(q.candidates.map((c) => [c.asset_id, j && j.grades[c.asset_id] !== undefined ? j.grades[c.asset_id] : 0]));
  $("flag").checked = Boolean(j && j.flag);
  $("note").value = (j && j.note) || "";
  $("status").textContent = j ? `Đã lưu lúc ${new Date(j.at).toLocaleString("vi-VN")}` : "";
  $("status").className = "status";
  renderQuery();
  S.saved = snapshot();
  renderList();
  store("judge.qid", q.qid);
  window.scrollTo({ top: 0 });
  const first = document.querySelector("#grid .card");
  if (focusGrid && first) first.focus({ preventScroll: true });
  else document.querySelector("#content h2").focus({ preventScroll: true });
}

function prevIndex() {
  const rows = visible().map(([, i]) => i).filter((i) => i < S.idx);
  return rows.length ? rows[rows.length - 1] : -1;
}
function nextIndex() {
  const rows = visible().map(([, i]) => i);
  const after = rows.filter((i) => i > S.idx);
  const todo = after.filter((i) => !judged(S.queries[i]));
  return todo[0] ?? after[0] ?? -1;
}

async function save() {
  if (S.busy || S.idx < 0) return;
  const q = S.queries[S.idx];
  const payload = { qid: q.qid, grades: S.grades, flag: $("flag").checked ? "bad_query" : null, note: $("note").value.trim() };
  S.busy = true; $("save").disabled = true;
  $("status").className = "status"; $("status").textContent = "Đang lưu…";
  try {
    const response = await fetch("/api/judgments", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = Array.isArray(body.detail) ? body.detail.map((d) => d.msg).join("; ") : body.detail;
      throw new Error(detail || `HTTP ${response.status}`);
    }
    S.judgments[q.qid] = { ...payload, grades: { ...payload.grades }, at: body.at };
    S.saved = snapshot();
    const next = nextIndex();
    if (next >= 0) { open(next, true); $("status").textContent = `Đã lưu ${q.qid}.`; }
    else { renderList(); $("status").textContent = `Đã lưu ${q.qid}. Không còn câu nào sau câu này trong danh sách đang hiển thị.`; }
  } catch (error) {
    $("status").className = "status error";
    $("status").textContent = `Chưa lưu được: ${error.message}. Điểm đã chấm vẫn còn trên trang, hãy thử lại.`;
  } finally {
    S.busy = false; $("save").disabled = false;
  }
}

$("save").addEventListener("click", save);
$("prev").addEventListener("click", () => { const i = prevIndex(); if (i >= 0) open(i, true); });
$("filter").addEventListener("change", (event) => { S.filter = event.target.value; store("judge.filter", S.filter); renderList(); });
document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") { event.preventDefault(); save(); }
});
window.addEventListener("beforeunload", (event) => { if (dirty()) { event.preventDefault(); event.returnValue = ""; } });

async function load() {
  try {
    const response = await fetch("/api/state");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    S.queries = data.queries; S.judgments = data.judgments || {};
    S.filter = recall("judge.filter") || "all";
    $("filter").value = S.filter;
    if (!S.queries.length) throw new Error("pool rỗng");
    const last = S.queries.findIndex((q) => q.qid === recall("judge.qid"));
    const firstTodo = S.queries.findIndex((q) => !judged(q));
    open(last >= 0 ? last : Math.max(0, firstTodo), false);
  } catch (error) {
    const box = document.createElement("div");
    box.className = "notice error";
    box.innerHTML = `<strong>Không tải được dữ liệu chấm.</strong><p></p>`;
    box.querySelector("p").textContent = `${error.message}. Kiểm tra judge_server.py đang chạy và đã có pool (scripts/build_eval_descriptive.py), rồi tải lại trang.`;
    $("content").replaceChildren(box);
    $("progress-text").textContent = "Lỗi tải dữ liệu";
  }
}
load();
</script>
</body>
</html>
