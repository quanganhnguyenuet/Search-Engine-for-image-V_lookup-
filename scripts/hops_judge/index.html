<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chấm hops-v1</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1c1d1f; --muted: #5d6168; --border: #dcdde0;
    --brand: #0f6b5c; --brand-soft: #e3f1ee; --bad: #b42318; --bad-soft: #fdecea;
    --part: #8a5a00; --part-soft: #fdf3dc; --focus: #1a56db;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --surface: #1d1f22; --text: #ececee; --muted: #a2a6ad; --border: #34373c;
      --brand: #5cc8b2; --brand-soft: #173a33; --bad: #f97066; --bad-soft: #3d1c19;
      --part: #f5c15c; --part-soft: #3a2e12; --focus: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  nav { border-right: 1px solid var(--border); background: var(--surface); padding: 12px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  nav h1 { font-size: 16px; margin: 4px 0 2px; }
  nav p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  nav ol { list-style: none; margin: 0; padding: 0; }
  nav button { width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 6px 8px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 6px; }
  nav button[aria-current="true"] { background: var(--brand-soft); }
  nav .done { color: var(--brand); font-weight: 600; min-width: 1em; }
  main { padding: 20px 24px 80px; max-width: 1200px; }
  .kind { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }
  h2 { font-size: 22px; margin: 6px 0 4px; }
  .tests, .help { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .parts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; padding: 0; list-style: none; }
  .parts li { border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
  details { margin: 8px 0 16px; font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .card[data-state="bad"] { border-color: var(--bad); }
  .card[data-state="part"] { border-color: var(--part); }
  .card[data-state="good"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .card h3 { font-size: 14px; margin: 0; }
  .thumbs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--border); }
  .found { font-size: 12px; color: var(--muted); }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .buttons button { border: 1px solid var(--border); background: var(--surface); color: inherit; border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .buttons button[aria-pressed="true"][data-g="0"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .buttons button[aria-pressed="true"][data-g="1"] { background: var(--part-soft); border-color: var(--part); color: var(--part); }
  .buttons button[aria-pressed="true"][data-g="2"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .bar { position: fixed; left: 280px; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 10px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bar textarea { flex: 1; min-width: 200px; height: 34px; font: inherit; font-size: 13px; background: var(--bg); color: inherit; border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
  .primary { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .secondary { background: none; color: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  #status { font-size: 13px; color: var(--muted); }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; height: auto; max-height: 40vh; }
    .bar { left: 0; }
    main { padding: 16px 16px 140px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav aria-label="Danh sách câu">
    <h1>hops-v1</h1>
    <p id="progress"></p>
    <ol id="list"></ol>
  </nav>
  <main id="main" aria-live="polite"></main>
</div>
<div class="bar">
  <label><input type="checkbox" id="bad"> Câu hỏi không hợp lý</label>
  <textarea id="note" aria-label="Ghi chú" placeholder="Ghi chú (tùy chọn)"></textarea>
  <button class="secondary" id="rest">Còn lại → Sai</button>
  <button class="primary" id="save">Lưu và sang câu tiếp</button>
  <span id="status" role="status"></span>
</div>
<script>
const state = { queries: [], index: 0, grades: {} };
const $ = (id) => document.getElementById(id);
const CONFIG = { current: "hiện tại", no_graph_prefetch: "tắt dense tập đích", no_graph_boost: "tắt điều chỉnh graph", content_only: "chỉ nội dung" };

async function load() {
  const data = await (await fetch("/api/state")).json();
  state.queries = data.queries;
  const first = state.queries.findIndex((q) => !q.judgment);
  show(first < 0 ? 0 : first);
}

function renderList() {
  const done = state.queries.filter((q) => q.judgment).length;
  $("progress").textContent = `Đã chấm ${done}/${state.queries.length} câu`;
  $("list").replaceChildren(...state.queries.map((q, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.setAttribute("aria-current", i === state.index ? "true" : "false");
    b.innerHTML = `<span class="done">${q.judgment ? "✓" : ""}</span><span></span>`;
    b.lastChild.textContent = `${q.qid} · ${q.query}`;
    b.onclick = () => show(i);
    li.append(b);
    return li;
  }));
}

function show(i) {
  state.index = i;
  const q = state.queries[i];
  const saved = q.judgment?.grades ?? {};
  state.grades = Object.fromEntries(Object.entries(saved).map(([k, v]) => [k, { ...v }]));
  $("bad").checked = q.judgment?.flag === "bad_query";
  $("note").value = q.judgment?.note ?? "";
  $("status").textContent = "";
  const t = q.traces.current;
  const main = $("main");
  main.innerHTML = "";
  const head = document.createElement("header");
  head.innerHTML = `<span class="kind"></span><h2></h2><p class="tests"></p>`;
  head.querySelector(".kind").textContent = q.kind === "multi_hop" ? "multi-hop" : "multi-intent";
  head.querySelector("h2").textContent = q.query;
  head.querySelector(".tests").textContent = `Kiểm tra: ${q.tests}`;
  main.append(head);
  const help = document.createElement("p");
  help.className = "help";
  help.textContent = q.kind === "multi_hop"
    ? "Đúng = đúng thứ câu hỏi muốn (đúng hãng, đúng loại nếu câu có giới hạn loại, không phải sản phẩm bị loại). Gần đúng = đúng hãng nhưng sai loại hàng câu hỏi giới hạn, hoặc liên quan gián tiếp. Sai = còn lại."
    : "Chọn vế mà sản phẩm đáp ứng. Gần đúng = liên quan nhưng không thật sự đáp ứng vế nào. Sai = không liên quan.";
  main.append(help);
  if (q.intents) {
    const ul = document.createElement("ul");
    ul.className = "parts";
    q.intents.forEach((part, k) => { const li = document.createElement("li"); li.textContent = `Vế ${k + 1}: ${part}`; ul.append(li); });
    main.append(ul);
  }
  const d = document.createElement("details");
  d.innerHTML = "<summary>Hệ thống hiểu câu thế nào (cấu hình hiện tại)</summary><p></p>";
  d.querySelector("p").textContent = `trạng thái ${t.status} · gốc: ${t.origins.join(", ") || "—"} · bị loại: ${t.excluded.join(", ") || "—"} · ${t.targets} entity đích · loại hàng: ${t.category.join(", ") || "—"}${t.negation ? ` · phủ định “${t.negation.cue}” ${t.negation.applied ? "đã áp dụng" : "bỏ qua"}` : ""}`;
  main.append(d);
  const grid = document.createElement("div");
  grid.className = "grid";
  q.entities.forEach((e) => grid.append(card(q, e)));
  main.append(grid);
  renderList();
  main.focus?.();
  window.scrollTo(0, 0);
}

function options(q) {
  if (q.kind === "multi_hop") return [["Sai", 0, null], ["Gần đúng", 1, null], ["Đúng", 2, null]];
  return [["Sai", 0, null], ["Gần đúng", 1, null], ...q.intents.map((p, k) => [`Vế ${k + 1}`, 2, k])];
}

function card(q, e) {
  const c = document.createElement("article");
  c.className = "card";
  c.innerHTML = `<h3></h3><div class="thumbs"></div><p class="found"></p><div class="buttons" role="group"></div>`;
  c.querySelector("h3").textContent = e.name;
  c.querySelector(".buttons").setAttribute("aria-label", `Chấm ${e.name}`);
  e.assets.slice(0, 4).forEach((a) => {
    const img = document.createElement("img");
    img.loading = "lazy"; img.src = `/img/${a.asset_id}`; img.alt = e.name;
    c.querySelector(".thumbs").append(img);
  });
  c.querySelector(".found").textContent = "Tìm thấy bởi: " + Object.entries(e.found_by).map(([k, r]) => `${CONFIG[k] ?? k} #${r}`).join(" · ");
  const box = c.querySelector(".buttons");
  options(q).forEach(([label, g, intent]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.g = g;
    b.onclick = () => { state.grades[e.entity_id] = { grade: g, intent }; paint(c, e.entity_id); };
    box.append(b);
  });
  paint(c, e.entity_id);
  return c;
}

function paint(c, id) {
  const cur = state.grades[id];
  c.dataset.state = !cur ? "" : cur.grade === 0 ? "bad" : cur.grade === 1 ? "part" : "good";
  c.querySelectorAll(".buttons button").forEach((b, k) => {
    const q = state.queries[state.index];
    const [, g, intent] = options(q)[k];
    b.setAttribute("aria-pressed", cur && cur.grade === g && (cur.intent ?? null) === intent ? "true" : "false");
  });
}

$("rest").onclick = () => {
  const q = state.queries[state.index];
  q.entities.forEach((e) => { if (!state.grades[e.entity_id]) state.grades[e.entity_id] = { grade: 0, intent: null }; });
  restoreGrades();
};
function restoreGrades() {
  document.querySelectorAll(".card").forEach((c, k) => paint(c, state.queries[state.index].entities[k].entity_id));
}

$("save").onclick = async () => {
  const q = state.queries[state.index];
  const missing = q.entities.filter((e) => !state.grades[e.entity_id]).length;
  if (missing) { $("status").textContent = `Còn ${missing} sản phẩm chưa chấm.`; return; }
  const body = { qid: q.qid, grades: state.grades, flag: $("bad").checked ? "bad_query" : null, note: $("note").value };
  const res = await fetch("/api/judgments", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) { $("status").textContent = `Lỗi: ${(await res.json()).detail}`; return; }
  q.judgment = body;
  const next = state.queries.findIndex((x, i) => i > state.index && !x.judgment);
  const any = state.queries.findIndex((x) => !x.judgment);
  if (next >= 0) show(next); else if (any >= 0) show(any); else { renderList(); $("status").textContent = "Đã chấm xong cả 40 câu."; }
};

load();
</script>
</body>
</html>
