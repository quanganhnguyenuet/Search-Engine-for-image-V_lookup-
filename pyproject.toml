[project]
name = "visualseek-workspace"
version = "0.1.0"
description = "Python workspace for the V-Lookup product image search engine."
requires-python = ">=3.12,<3.13"
dependencies = ["visualseek-api"]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "pytest>=8.3.5,<9",
  "ruff>=0.11.2,<0.12",
]

[tool.uv]
package = false

[tool.uv.sources]
visualseek-api = { workspace = true }

[tool.uv.workspace]
members = [
  "services/api",
  "packages/retrieval",
]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "scripts/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/api/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

