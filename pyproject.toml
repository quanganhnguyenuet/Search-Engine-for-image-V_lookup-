[project]
name = "visualseek-workspace"
version = "0.1.0"
description = "Python workspace for VisualSeek services and AI component contracts."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "pytest>=8.3.5,<9",
  "ruff>=0.11.2,<0.12",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "services/api",
  "packages/preprocessing",
  "packages/embedding",
  "packages/retrieval",
  "packages/evaluation",
]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/api/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

