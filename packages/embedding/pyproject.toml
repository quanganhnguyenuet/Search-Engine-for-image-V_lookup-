[project]
name = "visualseek-embedding"
version = "0.1.0"
description = "Contracts for VisualSeek text and image embedding components."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<12"]

[project.optional-dependencies]
model = ["torch>=2.6,<3", "transformers==4.57.6", "sentencepiece>=0.2,<0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualseek_embedding"]

