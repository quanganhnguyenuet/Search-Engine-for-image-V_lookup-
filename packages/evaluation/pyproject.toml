[project]
name = "visualseek-evaluation"
version = "0.1.0"
description = "Contracts for VisualSeek retrieval evaluation components."
requires-python = ">=3.12,<3.13"
dependencies = ['visualseek-retrieval']

[tool.uv.sources]
visualseek-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualseek_evaluation"]

