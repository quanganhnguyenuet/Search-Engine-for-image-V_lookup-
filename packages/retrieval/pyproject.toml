[project]
name = "visualseek-retrieval"
version = "0.1.0"
description = "Contracts for VisualSeek vector retrieval components."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualseek_retrieval"]

