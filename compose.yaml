name: visualseek

services:
  web:
    build:
      context: ./apps/web
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      CULTURE_DATA_DIR: /data
      CULTURE_IMAGE_ROOT: /data/raw/vietnamese-culture-vqa
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - ./data:/data:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://visualseek:visualseek@postgres:5432/visualseek}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-http://object-storage:9000}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-visualseek}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-visualseek-local-secret}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-visualseek-images}
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/workspace/services/api
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      object-storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visualseek}
      POSTGRES_USER: ${POSTGRES_USER:-visualseek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visualseek}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  object-storage:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visualseek}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-visualseek-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_storage_data:/data

volumes:
  web_node_modules:
  postgres_data:
  qdrant_data:
  object_storage_data:

