[project]
name = "visualseek-api"
version = "0.1.0"
description = "HTTP API for VisualSeek."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.12,<0.116",
  "pydantic-settings>=2.8.1,<3",
  "structlog>=25.2.0,<26",
  "uvicorn[standard]>=0.34.0,<0.35",
  "httpx>=0.28.1,<0.29",
  "visualseek-embedding",
  "visualseek-retrieval",
]

[project.optional-dependencies]
model = ["visualseek-embedding[model]"]

[tool.uv.sources]
visualseek-embedding = { workspace = true }
visualseek-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualseek_api"]

